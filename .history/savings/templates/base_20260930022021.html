<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Savings</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; }
    nav { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    nav form { margin: 0; }
    button, .btn { padding: 8px 14px; cursor: pointer; }
    input { padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .error { color: #c00; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    {% if user.is_staff %}
      <a href="{% url 'admin_home' %}">Admin</a>
    {% endif %}
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
