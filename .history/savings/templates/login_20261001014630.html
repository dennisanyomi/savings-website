{% extends "base.html" %}
{% block content %}
<div class="card" style="margin-top: 24px;">
  <h2>Welcome back</h2>
  <p class="muted">Log in to see your group savings.</p>
  {% if form.errors %}
    <p class="error">Wrong username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}
    <label>Password</label>
    {{ form.password }}
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
