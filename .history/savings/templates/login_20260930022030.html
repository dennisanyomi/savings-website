{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
{% if form.errors %}
  <p class="error">Wrong username or password.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Username</label>
  {{ form.username }}
  <label>Password</label>
  {{ form.password }}
  <button type="submit">Log in</button>
</form>
{% endblock %}
